<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار | نظام التشغيل الشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE3;
  --bg-soft:#EDE1CB;
  --card:#FFFBF4;
  --card-2:#F0DCC0;
  --accent:#D7915A;
  --accent-dark:#B8703A;
  --accent-soft:#e8bd94;
  --text:#3B3C35;
  --text-soft:#7d7d6f;
  --border:#e2d4b8;
  --danger:#c17a5a;
  --warn:#d9b25a;
  --ok:#7a9b6e;
  --shadow:0 4px 18px rgba(59,60,53,.12);
  --radius:16px;
}
body.night{
  --bg:#25261f;
  --bg-soft:#2d2e26;
  --card:#3B3C35;
  --card-2:#454639;
  --accent:#D7915A;
  --accent-dark:#e8a873;
  --accent-soft:#8a6a4a;
  --text:#f0e6d5;
  --text-soft:#b8ac95;
  --border:#4a4b3d;
  --shadow:0 4px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg,var(--bg) 0%, var(--bg-soft) 100%);
  color:var(--text);
  font-family:'Segoe UI','Tahoma',sans-serif;
  min-height:100vh;
  transition:background .4s ease,color .4s ease;
}
[dir="rtl"] body{font-family:'Cairo','Tahoma','Segoe UI',sans-serif;}
button{font-family:inherit;cursor:pointer;border:none;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--accent-soft);border-radius:8px;}

/* ===== Auth Screen ===== */
#authScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.auth-box{
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  padding:40px 32px;max-width:380px;width:100%;text-align:center;
  border:1px solid var(--border);
}
.auth-logo{font-size:2.4em;font-weight:900;color:var(--accent);margin-bottom:6px;letter-spacing:1px;}
.auth-sub{color:var(--text-soft);margin-bottom:24px;font-size:.95em;}
.auth-box input{
  width:100%;padding:13px 16px;margin-bottom:12px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:1em;
  outline:none;transition:border .2s;
}
.auth-box input:focus{border-color:var(--accent);}
.auth-btn{
  width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;
  font-weight:700;font-size:1em;margin-top:6px;transition:background .2s;
}
.auth-btn:hover{background:var(--accent-dark);}
.auth-switch{margin-top:16px;font-size:.88em;color:var(--text-soft);}
.auth-switch span{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;}
.auth-error{color:#b5545c;font-size:.85em;margin-top:6px;min-height:1.2em;}
.hidden{display:none !important;}

/* ===== App Shell ===== */
#app{max-width:1200px;margin:0 auto;padding:16px 16px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border-radius:20px;padding:16px 22px;box-shadow:var(--shadow);
  margin-bottom:18px;flex-wrap:wrap;border:1px solid var(--border);
}
.tb-left{display:flex;align-items:center;gap:14px;}
.logo{font-weight:900;font-size:1.6em;color:var(--accent);}
.greeting{font-size:1.05em;font-weight:600;color:var(--text);}
.greeting-name{font-family:'Cairo',sans-serif;font-size:1.25em;font-weight:800;color:var(--text);}
.greeting-date{font-family:'Tahoma',sans-serif;font-weight:400;color:var(--text-soft);font-size:.85em;margin-top:4px;}
.greeting-quote{font-family:'Cairo',sans-serif;font-weight:700;color:var(--accent-dark);font-size:1.3em;margin-top:6px;line-height:1.4;}
.tb-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  background:var(--bg-soft);color:var(--accent-dark);border-radius:10px;padding:9px 13px;
  font-size:.85em;font-weight:700;border:1px solid var(--border);transition:.2s;position:relative;
}
.icon-btn:hover{background:var(--accent);color:#fff;}
.icon-btn.active{background:var(--accent);color:#fff;}
.badge{
  position:absolute;top:-6px;inset-inline-end:-6px;background:var(--danger);color:#fff;
  border-radius:999px;font-size:.7em;padding:1px 6px;font-weight:800;min-width:18px;text-align:center;
}

/* ===== App body layout: sidebar + content ===== */
.app-body{display:flex;gap:18px;align-items:flex-start;}
.content-area{flex:1;min-width:0;}

/* ===== Tabs (always a sidebar, on every screen size) ===== */
.tabs{display:flex;flex-direction:column;gap:6px;flex:0 0 210px;position:sticky;top:16px;max-height:92vh;overflow-y:auto;}
.tab-btn{
  padding:12px 14px;border-radius:14px;background:var(--card);
  color:var(--text-soft);font-weight:700;font-size:.86em;border:1px solid var(--border);
  transition:.2s;white-space:normal;text-align:start;line-height:1.3;
}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.tab-content{display:none;animation:fadeIn .3s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:760px){
  .tabs{flex:0 0 108px;font-size:.9em;}
  .tab-btn{padding:10px 8px;font-size:.78em;}
}

/* ===== Cards ===== */
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.card h3{margin:0 0 14px;color:var(--accent-dark);font-size:1.1em;display:flex;align-items:center;gap:8px;}
.card h4{margin:16px 0 8px;color:var(--accent);font-size:.95em;}
.card.compact{padding:13px 15px;margin-bottom:12px;}
.card.compact h3{font-size:.92em;margin-bottom:8px;}
.card.compact h4{font-size:.8em;margin:8px 0 5px;}
.card.compact .progress-label{font-size:.72em;}
.card.compact .mood-btn{padding:6px 10px;font-size:.8em;}
.card.compact .check-item{padding:5px 2px;font-size:.85em;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:720px){.grid2{grid-template-columns:1fr;}}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media (max-width:640px){.grid3{grid-template-columns:1fr 1fr;}}
@media (max-width:400px){.grid3{grid-template-columns:1fr;}}

/* checklist */
.check-item{
  display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);
  font-size:.95em;
}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{
  width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;
}
.check-item label{flex:1;cursor:pointer;}
.check-item.done label{text-decoration:line-through;color:var(--text-soft);}

.check-item.dragging{opacity:.75;background:var(--card-2);box-shadow:var(--shadow);border-radius:8px;}
.task-card.dragging{opacity:.8;box-shadow:var(--shadow);}
.kanban-col.drop-hover{outline:2.5px dashed var(--accent);outline-offset:-4px;}
.progress-wrap{background:var(--bg-soft);border-radius:10px;height:14px;overflow:hidden;margin:8px 0;}
.progress-bar{height:100%;background:var(--accent);transition:width .4s ease;border-radius:10px;}
.progress-label{font-size:.8em;color:var(--text-soft);text-align:center;}

/* mood */
.mood-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.mood-btn{
  padding:10px 14px;border-radius:14px;background:var(--bg-soft);font-size:1em;
  border:2px solid transparent;transition:.2s;font-weight:700;display:flex;align-items:center;gap:6px;
}
.mood-btn .em{font-size:1.3em;}
.mood-btn.sel{border-color:var(--accent);background:var(--card-2);}
.mood-msg{
  background:var(--card-2);border-radius:12px;padding:12px 14px;font-size:.9em;
  color:var(--accent-dark);margin-bottom:10px;display:none;
}
textarea, input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-size:.87em;outline:none;
}
textarea:focus,input:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}
.btn{
  background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;
  font-size:.9em;transition:.2s;
}
.btn:hover{background:var(--accent-dark);}
.btn.outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn.small{padding:6px 12px;font-size:.8em;}
.btn.danger{background:var(--danger);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row > *{flex:1;}
label.field-label{font-size:.8em;color:var(--text-soft);margin-bottom:4px;display:block;}
.thumb{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin:0 auto;}
.cal-grid.small{max-width:340px;gap:4px;}
.cal-grid.small .cal-cell{font-size:.68em;}
.kanban-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media (max-width:760px){.kanban-grid{grid-template-columns:1fr;}}
.grid-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
@media (max-width:760px){.grid-week{grid-template-columns:repeat(4,1fr);}}
.week-day{background:var(--bg-soft);border-radius:10px;padding:6px;border:1px solid var(--border);min-height:70px;}
.week-day.today{border-color:var(--accent);border-width:2px;}
.week-day-label{font-size:.72em;font-weight:800;color:var(--text-soft);text-align:center;margin-bottom:4px;}
.week-task{background:var(--accent);color:#fff;font-size:.68em;border-radius:5px;padding:2px 4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-cell{
  aspect-ratio:1;border-radius:10px;background:var(--bg-soft);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:.75em;color:var(--text-soft);position:relative;
  border:1px solid var(--border);
}
.cal-cell.today{border-color:var(--accent);border-width:2px;}
.cal-cell .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:2px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px;}
.bar-chart.mini{height:60px;padding-top:4px;}
.bar-chart.mini .bar-label{font-size:.62em;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-pct{font-size:.68em;color:var(--accent-dark);font-weight:800;margin-bottom:3px;}
.bar-track{width:100%;flex:1;background:var(--bg-soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;border:1px solid var(--border);}
.bar-fill{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s;}
.bar-label{font-size:.7em;color:var(--text-soft);margin-top:4px;}
.challenge-day-grid{display:flex;flex-wrap:wrap;gap:6px;}
.cday{
  width:34px;height:34px;border-radius:8px;background:var(--bg-soft);display:flex;align-items:center;
  justify-content:center;font-size:.75em;font-weight:700;color:var(--text-soft);border:1px solid var(--border);
}
.cday.done{background:var(--accent);color:#fff;}
</style>
</head>

};

});

const CLOUDINARY_CLOUD_NAME = 'nhgcd8os';
const CLOUDINARY_UPLOAD_PRESET = 'mouploads';
async function uploadToCloudinary(fileOrBlob, resourceType, filename){
  const formData = new FormData();
  formData.append('file', fileOrBlob, filename||'upload');
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
  const res = await fetch(url, {method:'POST', body:formData});
  const data = await res.json();
  if(!data.secure_url) throw new Error((data.error && data.error.message) || 'Upload failed');
  return data.secure_url;
}

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function defaultData(name){
  return {
    profile:{name:name||''},
    dailyLogs:{}, voiceNotes:[], chatterPhotos:[], measurements:[], tasks:[],
    budget:{income:0,savingsTarget:0,expenses:[]},
    challenges:[], meals:[], media:[],
    fitnessSchedule:{0:'lower',1:'rest',2:'upper',3:'lower',4:'rest',5:'rest',6:'upper'},
    customPlan:{height:'',weight:'',goal:'',exercises:[]},
    routineItems:[], selfcareItems:[], customQuestions:[], weeklyGoals:{weekKey:'', goals:['','']}
  };

// Seeds editable habit lists from the built-in defaults the first time (called at runtime, after ROUTINE_ITEMS/SELFCARE_FIXED are defined further down the script).
function ensureCustomItems(){
  if(!DB.routineItems || DB.routineItems.length===0) DB.routineItems = ROUTINE_ITEMS.map(i=>Object.assign({},i));
  if(!DB.selfcareItems || DB.selfcareItems.length===0) DB.selfcareItems = SELFCARE_FIXED.map(i=>Object.assign({},i));
}
let DB = defaultData('');

let saveTimer = null;
function saveDB(){
  if(!currentUser || !dataLoaded) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    firestore.collection('users').doc(currentUser.uid).set(DB)
      .catch(err=>console.error('Save failed:', err));
  }, 500);
}
async function loadUserData(uid){
  dataLoaded = false;
  const doc = await firestore.collection('users').doc(uid).get();
  if(doc.exists){
    DB = Object.assign(defaultData(''), doc.data());
    if(!DB.fitnessSchedule) DB.fitnessSchedule = defaultData().fitnessSchedule;
    if(!DB.customPlan) DB.customPlan = defaultData().customPlan;
    if(!DB.chatterPhotos) DB.chatterPhotos = [];
    if(!DB.challenges) DB.challenges = [];
  } else {
    DB = defaultData(currentUser.displayName||'');
    await firestore.collection('users').doc(uid).set(DB);
  }
  ensureCustomItems();
  dataLoaded = true;
}

function dayLog(dateStr){
  dateStr = dateStr || todayStr();
  if(!DB.dailyLogs[dateStr]){
    DB.dailyLogs[dateStr] = {routine:{}, selfcare:{}, mood:null, moodNote:'', gratitude:['','',''], chatterText:'', exercise:{}, customExercise:{}, water:0, intensity:0, bodyNote:'', familyDone:false, familyNote:''};
  }
  const l = DB.dailyLogs[dateStr];
  if(l.customExercise===undefined) l.customExercise = {};
  if(l.familyDone===undefined) l.familyDone = false;
  if(l.familyNote===undefined) l.familyNote = '';
  return l;
}

/* ---------- language ---------- */
function applyLangToDOM(){
  document.documentElement.lang = LANG==='ar'?'ar':'en';
  document.documentElement.dir = LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-ar]').forEach(el=>{
    const txt = LANG==='ar'? el.getAttribute('data-ar') : el.getAttribute('data-en');
    if(txt!==null) el.textContent = txt;
  });
  document.querySelectorAll('[data-ar-ph]').forEach(el=>{
    const txt = LANG==='ar'? el.getAttribute('data-ar-ph') : el.getAttribute('data-en-ph');
    if(txt!==null) el.setAttribute('placeholder', txt);
  });
  document.getElementById('langBtn').textContent = LANG==='ar' ? 'EN' : 'AR';
}
function toggleLang(){
  LANG = LANG==='ar' ? 'en' : 'ar';
  localStorage.setItem('pos_lang', LANG);
  applyLangToDOM();
  if(dataLoaded) renderAllTabs();
  updateGreeting();
}
function T(ar,en){ return LANG==='ar' ? ar : en; }

/* ---------- notifications ---------- */
function renderNotifyPanel(){
  const panel = document.getElementById('notifyPanel');
  if(!panel) return;
  const items = checkReminders(false);
  let html = `<div style="font-weight:800;margin-bottom:8px;color:var(--accent-dark)">🔔 ${T('التذكيرات','Reminders')}</div>`;
  if(items.length===0){
    html += `<p style="color:var(--text-soft);font-size:.85em">${T('لا توجد تذكيرات الآن 🎉','No reminders right now 🎉')}</p>`;
  } else {
    items.forEach(r=> html += `<div style="font-size:.88em;padding:6px 0;border-bottom:1px solid var(--border)">• ${r}</div>`);
  }
  if(!('Notification' in window) || Notification.permission!=='granted'){
    html += `<button class="btn small" style="margin-top:10px;width:100%" onclick="requestNotifyPermission()">${T('تفعيل إشعارات المتصفح','Enable browser notifications')}</button>`;
  }
  panel.innerHTML = html;
}
function toggleNotifyPanel(){
  const panel = document.getElementById('notifyPanel');
  if(!panel) return;
  const isHidden = panel.classList.contains('hidden');
  if(isHidden){ renderNotifyPanel(); panel.classList.remove('hidden'); }
  else panel.classList.add('hidden');
}
document.addEventListener('click', function(ev){
  const panel = document.getElementById('notifyPanel');
  const btn = document.getElementById('notifyBtn');
  if(panel && !panel.classList.contains('hidden') && !panel.contains(ev.target) && ev.target!==btn){
    panel.classList.add('hidden');
  }
});
function requestNotifyPermission(){
  if(!('Notification' in window)){ alert(T('المتصفح لا يدعم الإشعارات','Browser does not support notifications')); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted') checkReminders(true);
    renderNotifyPanel();
  });
}
function checkReminders(showNotif){
  const log = dayLog();
  const dow = new Date().getDay();
  const items = [];
  const routineDone = DB.routineItems.filter(i=>log.routine[i.id]).length;
  if(routineDone < DB.routineItems.length) items.push(T('لسه ما خلصتِ الروتين اليومي','Daily routine not finished yet'));
  const wtype = DB.fitnessSchedule[dow];
  if(wtype && wtype!=='rest'){
    const set = wtype==='upper'?EXERCISES_UPPER:EXERCISES_LOWER;
    const done = set.filter(e=>log.exercise[e.id]).length;
    if(done < set.length) items.push(T('عندك تمارين اليوم لسه ما خلصتيها','You have unfinished workouts today'));
  }
  const dueTasks = DB.tasks.filter(t=>t.status!=='done' && t.date===todayStr());
  if(dueTasks.length) items.push(T(`عندك ${dueTasks.length} مهمة مستحقة اليوم`, `You have ${dueTasks.length} tasks due today`));
  const badge = document.getElementById('notifyBadge');
  if(badge){
    if(items.length){ badge.textContent = items.length; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  }
  if(showNotif && items.length && Notification.permission==='granted'){
    new Notification('mo', {body: items.join(' • ')});
  }
  return items;
}

/* ---------- auth ---------- */
function switchAuthTab(mode){
  document.getElementById('signupForm').classList.toggle('hidden', mode!=='signup');
  document.getElementById('loginForm').classList.toggle('hidden', mode!=='login');
  document.getElementById('authTabSignup').classList.toggle('active', mode==='signup');
  document.getElementById('authTabLogin').classList.toggle('active', mode==='login');
}
function authErrorMsg(err){
  const code = err && err.code || '';
  const map = {
    'auth/email-already-in-use': T('هذا البريد مسجل مسبقاً، جرّبي تسجيل الدخول','This email is already registered — try logging in'),
    'auth/invalid-email': T('صيغة البريد الإلكتروني غير صحيحة','Invalid email address'),
    'auth/weak-password': T('كلمة السر ضعيفة، استخدمي 6 أحرف على الأقل','Password is too weak — use at least 6 characters'),
    'auth/user-not-found': T('لا يوجد حساب بهذا البريد','No account found with this email'),
    'auth/wrong-password': T('كلمة السر غير صحيحة','Incorrect password'),
    'auth/invalid-credential': T('البريد أو كلمة السر غير صحيحة','Incorrect email or password'),
    'auth/too-many-requests': T('محاولات كثيرة، حاولي لاحقاً','Too many attempts — please try again later'),
  };
  return map[code] || (T('حدث خطأ: ','Error: ') + (err && err.message ? err.message : ''));
}
async function doSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass = document.getElementById('su-pass').value;
  document.getElementById('su-error').textContent = '';
  if(!name || !email || !pass){
    document.getElementById('su-error').textContent = T('يرجى تعبئة كل الحقول','Please fill in all fields');
    return;
  }
  const btn = document.getElementById('su-btn');
  btn.disabled = true;
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({displayName:name});
  }catch(err){
    document.getElementById('su-error').textContent = authErrorMsg(err);
  }
  btn.disabled = false;
}
async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  document.getElementById('li-error').textContent = '';
  if(!email || !pass){
    document.getElementById('li-error').textContent = T('يرجى تعبئة كل الحقول','Please fill in all fields');
    return;
  }
  const btn = document.getElementById('li-btn');
  btn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(err){
    document.getElementById('li-error').textContent = authErrorMsg(err);
  }
  btn.disabled = false;
}
async function doForgotPassword(){
  const email = document.getElementById('li-email').value.trim();
  if(!email){
    document.getElementById('li-error').textContent = T('اكتبي بريدكِ الإلكتروني أولاً','Enter your email first');
    return;
  }
  try{
    await auth.sendPasswordResetEmail(email);
    document.getElementById('li-error').style.color = 'var(--ok)';
    document.getElementById('li-error').textContent = T('تم إرسال رابط إعادة التعيين إلى بريدكِ','Password reset link sent to your email');
  }catch(err){
    document.getElementById('li-error').style.color = '';
    document.getElementById('li-error').textContent = authErrorMsg(err);
  }
}
function logout(){
  auth.signOut();
}

function updateGreeting(){
  const h = new Date().getHours();
  const name = (currentUser && currentUser.displayName) || (DB.profile && DB.profile.name) || '';
  let msg;
  if(h < 12) msg = T(`أهلاً ${name}، نهارك بهيج 🌱`, `Hi ${name}, have a bright day 🌱`);
  else if(h < 18) msg = T(`أهلاً ${name}، عصرك سعيد ☀️`, `Hi ${name}, a lovely afternoon ☀️`);
  else msg = T(`أهلاً ${name}، مساؤك بهيج 🌌`, `Hi ${name}, have a lovely evening 🌌`);
  const q = getDailyQuote();
  const dateLine = new Date().toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{weekday:'long', month:'long', day:'numeric'});
  const qLine = `${T(q.ar,q.en)}${q.refAr? ` — ${T(q.refAr,q.refEn)}`:''}`;
  document.getElementById('greetingText').innerHTML =
    `<div class="greeting-name">${msg}</div>` +
    `<div class="greeting-date">${dateLine}</div>` +
    `<div class="greeting-quote">${qLine}</div>`;
}

/* ---- Touch/mouse-compatible drag reorder for habit lists (Pointer Events) ---- */
let habitDragState = null;
function startHabitDrag(ev, listName){
  ev.preventDefault();
  const itemEl = ev.currentTarget.closest('.check-item');
  const container = itemEl.parentElement;
  habitDragState = {listName, itemEl, container, startY: ev.clientY};
  itemEl.classList.add('dragging');
  itemEl.style.position = 'relative';
  itemEl.style.zIndex = 10;
  window.addEventListener('pointermove', onHabitDragMove);
  window.addEventListener('pointerup', onHabitDragEnd);
}
function onHabitDragMove(ev){
  if(!habitDragState) return;
  const dy = ev.clientY - habitDragState.startY;
  habitDragState.itemEl.style.transform = `translateY(${dy}px)`;
  const items = Array.from(habitDragState.container.querySelectorAll('.check-item'));
  const draggedIndex = items.indexOf(habitDragState.itemEl);
  for(let i=0;i<items.length;i++){
    if(items[i]===habitDragState.itemEl) continue;
    const rect = items[i].getBoundingClientRect();
    const mid = rect.top + rect.height/2;
    if(ev.clientY < mid && i < draggedIndex){
      habitDragState.container.insertBefore(habitDragState.itemEl, items[i]);
      habitDragState.startY = ev.clientY;
      habitDragState.itemEl.style.transform = 'translateY(0px)';
      break;
    } else if(ev.clientY > mid && i > draggedIndex){
      habitDragState.container.insertBefore(habitDragState.itemEl, items[i].nextSibling);
      habitDragState.startY = ev.clientY;
      habitDragState.itemEl.style.transform = 'translateY(0px)';
      break;
    }
  }
}
function onHabitDragEnd(){
  if(!habitDragState) return;
  const {listName, itemEl} = habitDragState;
  itemEl.style.transform = '';
  itemEl.style.position = '';
  itemEl.style.zIndex = '';
  itemEl.classList.remove('dragging');
  window.removeEventListener('pointermove', onHabitDragMove);
  window.removeEventListener('pointerup', onHabitDragEnd);
  habitDragState = null;

  if(listName==='routineItems'){
    const spiritIds = Array.from(document.querySelectorAll('#routine-spirit-list .check-item')).map(el=>el.dataset.id);
    const mindIds = Array.from(document.querySelectorAll('#routine-mind-list .check-item')).map(el=>el.dataset.id);
    const map = {}; DB.routineItems.forEach(i=>map[i.id]=i);
    DB.routineItems = [...spiritIds.map(id=>map[id]), ...mindIds.map(id=>map[id])].filter(Boolean);
  } else {
    const ids = Array.from(document.querySelectorAll('#selfcare-fixed-list .check-item')).map(el=>el.dataset.id);
    const map = {}; DB.selfcareItems.forEach(i=>map[i.id]=i);
    DB.selfcareItems = ids.map(id=>map[id]).filter(Boolean);
  }
  saveDB();
  renderTab1(); renderTab0();
}

function updateTimerDisplay(){
  const m = Math.floor(timerRemaining/60), s = timerRemaining%60;

}
function startTimer(){
  if(timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining<=0){
      clearInterval(timerInterval); timerRunning=false;
      try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); }catch(e){}
      alert(T('انتهى الوقت 🌸','Time\'s up 🌸'));

}

async function toggleRecording(){
  if(!recording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
      mediaRecorder.onstop = async ()=>{
        const blob = new Blob(audioChunks, {type:'audio/webm'});
        stream.getTracks().forEach(t=>t.stop());
        const voiceListEl = document.getElementById('voiceList');
        if(voiceListEl) voiceListEl.innerHTML = `<p style="color:var(--text-soft);font-size:.85em">${T('جارٍ الحفظ...','Saving...')}</p>`;
        try{
          const url = await uploadToCloudinary(blob, 'video', `voice_${Date.now()}.webm`);
          DB.voiceNotes.push({id:Date.now(), date:todayStr(), url, tag:'chatter'});
          saveDB();
        }catch(e){ console.error(e); alert(T('تعذر حفظ التسجيل','Could not save the recording')); }
        renderVoiceList();
      };
      mediaRecorder.start();
      recording = true;
    }catch(e){ alert(T('تعذر الوصول إلى الميكروفون','Could not access microphone')); return; }
  } else {
    mediaRecorder.stop();
    recording = false;
  }
  renderTab3();
}
function renderVoiceList(){
  const el = document.getElementById('voiceList');
  if(!el) return;
  const todays = DB.voiceNotes.filter(v=>v.date===todayStr() && v.tag!=='question').reverse();

}

}

  const last = list[list.length-1];
  const prev = list.length>1 ? list[list.length-2] : null;
  const fields = [['waist',T('الخصر','Waist')],['belly',T('البطن','Belly')],['hips',T('الأرداف','Hips')],['thighR',T('فخذ يمين','R. thigh')],['thighL',T('فخذ يسار','L. thigh')],['chest',T('الصدر','Chest')]];

    html += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0">${label}</td><td style="text-align:center">${last[k]}</td><td style="text-align:center;color:${color};font-weight:700">${diffTxt}</td></tr>`;

}

      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div>';

  // Calendar
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const tasksByDate = {};
  DB.tasks.forEach(t=>{ if(t.date){ tasksByDate[t.date] = (tasksByDate[t.date]||0)+1; } });

  // Weekly calendar (current week, Sunday to Saturday)
  const todayDow = now.getDay();
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-todayDow);
  html += `<div class="card"><h3>🗓️ ${T('تقويم المهام هذا الأسبوع','This Week\'s Task Calendar')}</h3><div class="grid-week">`;
  for(let i=0;i<7;i++){
    const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const isToday = dateStr===todayStr();
    const dayTasks = DB.tasks.filter(t=>t.date===dateStr);
    html += `<div class="week-day ${isToday?'today':''}">
      <div class="week-day-label">${d.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{weekday:'short'})}<br>${d.getDate()}</div>
      ${dayTasks.map(t=>`<div class="week-task" title="${t.name}">${t.name}</div>`).join('') || ''}
    </div>`;
  }
  html += '</div></div>';

  html += `<div class="card"><h3>📅 ${T('تقويم المهام هذا الشهر','This Month\'s Task Calendar')}</h3><div class="cal-grid small">`;
  for(let i=0;i<firstDow;i++) html += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = dateStr===todayStr();
    const count = tasksByDate[dateStr]||0;
    html += `<div class="cal-cell ${isToday?'today':''}"><div>${d}</div>${count? `<div class="dot"></div>`:''}</div>`;
  }
  html += '</div></div>';

  // Completion chart (last 7 days + last 4 weeks)
  html += `<div class="card"><h3>📊 ${T('إنجاز آخر 7 أيام','Last 7 Days Completion')}</h3><div class="bar-chart">`;
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dl = DB.dailyLogs[ds];
    let pct = 0;
    if(dl){
      const totalItems = DB.routineItems.length + DB.selfcareItems.length;
      const doneItems = DB.routineItems.filter(it=>dl.routine[it.id]).length + DB.selfcareItems.filter(it=>dl.selfcare[it.id]).length;
      pct = totalItems? Math.round(doneItems/totalItems*100):0;
    }
    html += `<div class="bar-col"><div class="bar-pct">${pct}%</div><div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div><div class="bar-label">${d.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{weekday:'short'})}</div></div>`;
  }
  html += '</div></div>';

  html += `<div class="card"><h3>📊 ${T('إنجاز آخر 4 أسابيع','Last 4 Weeks Completion')}</h3><div class="bar-chart">`;
  for(let w=3; w>=0; w--){
    let sumPct = 0, count = 0;
    for(let i=0;i<7;i++){
      const d = new Date(); d.setDate(d.getDate() - (w*7 + i));
      const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const dl = DB.dailyLogs[ds];
      if(dl){
        const totalItems = DB.routineItems.length + DB.selfcareItems.length;
        const doneItems = DB.routineItems.filter(it=>dl.routine[it.id]).length + DB.selfcareItems.filter(it=>dl.selfcare[it.id]).length;
        sumPct += totalItems? (doneItems/totalItems*100):0;
        count++;
      }
    }
    const avgPct = count? Math.round(sumPct/count):0;
    html += `<div class="bar-col"><div class="bar-pct">${avgPct}%</div><div class="bar-track"><div class="bar-fill" style="height:${avgPct}%"></div></div><div class="bar-label">${T('أسبوع','Week')} ${4-w}</div></div>`;
  }
  html += '</div></div>';

  document.getElementById('tab6').innerHTML = html;
}
function selectPriority(p){

    if(isSel){ btn.style.background=color; btn.style.color='#fff'; btn.classList.remove('outline'); }

function moveTaskStatus(id, status){
  if(!status) return;
  const t = DB.tasks.find(x=>x.id===id);
  if(t){ t.status = status; saveDB(); renderTab6(); renderTab0(); }
}
let taskDragState = null;
function startTaskDrag(ev, id){
  ev.preventDefault();
  const cardEl = ev.currentTarget.closest('.task-card');
  taskDragState = {id, cardEl, startX: ev.clientX, startY: ev.clientY};
  cardEl.classList.add('dragging');
  cardEl.style.position = 'relative';
  cardEl.style.zIndex = 50;
  window.addEventListener('pointermove', onTaskDragMove);
  window.addEventListener('pointerup', onTaskDragEnd);
}
function onTaskDragMove(ev){
  if(!taskDragState) return;
  const dx = ev.clientX - taskDragState.startX;
  const dy = ev.clientY - taskDragState.startY;
  taskDragState.cardEl.style.transform = `translate(${dx}px,${dy}px)`;
  document.querySelectorAll('.kanban-col').forEach(col=>{
    const rect = col.getBoundingClientRect();
    const over = ev.clientX>=rect.left && ev.clientX<=rect.right && ev.clientY>=rect.top && ev.clientY<=rect.bottom;
    col.classList.toggle('drop-hover', over);
  });
}
function onTaskDragEnd(){
  if(!taskDragState) return;
  const {id, cardEl} = taskDragState;
  cardEl.style.transform = '';
  cardEl.style.position = '';
  cardEl.style.zIndex = '';
  cardEl.classList.remove('dragging');
  let targetStatus = null;
  document.querySelectorAll('.kanban-col').forEach(col=>{
    if(col.classList.contains('drop-hover')){ targetStatus = col.dataset.status; }
    col.classList.remove('drop-hover');
  });
  window.removeEventListener('pointermove', onTaskDragMove);
  window.removeEventListener('pointerup', onTaskDragEnd);
  taskDragState = null;
  if(targetStatus){
    const t = DB.tasks.find(x=>x.id===id);
    if(t){ t.status = targetStatus; saveDB(); }
  }
  renderTab6(); renderTab0();
}
function addTask(){
  const name=document.getElementById('t-name').value.trim();

  DB.tasks.push({id:Date.now(), name, place:document.getElementById('t-place').value, date:document.getElementById('t-date').value, priority:document.getElementById('t-priority').value, status:'todo'});
  saveDB(); renderTab6(); renderTab0();
}

  const c = DB.challenges.find(x=>x.id==id);
  if(!c) return;
  const input = document.getElementById('ch-photo-input');
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];

    <div id="media-type-other-wrap" class="hidden" style="margin-top:8px">
      <label class="field-label">${T('اكتبي نوع الترفيه/التعلم','Write the type')}</label>
      <input type="text" id="media-type-other">
    </div>
    <label class="field-label">${T('ماذا تعلمتِ جديداً واستفدتِ من هذا؟','What did you learn and gain from this?')}</label>
    <textarea id="media-note"></textarea>
    <button class="btn" style="margin-top:10px" onclick="addMedia()">${T('إضافة','Add')}</button>
    <div style="margin-top:14px">${DB.media.slice().reverse().map(m=>`<div class="check-item"><span style="flex:1"><b>${m.title}</b> — ${m.date} <span style="color:var(--text-soft);font-size:.85em">(${m.type})</span></span></div><div style="font-size:.85em;color:var(--text-soft);margin:-4px 0 8px">${m.note||''}</div>`).join('') || ''}</div>
  </div>`;

  html += `<div class="card"><h3>👨‍👩‍👧 ${T('وقت العائلة','Family Time')}</h3>
    <div class="check-item ${log.familyDone?'done':''}">
      <input type="checkbox" id="family-check" ${log.familyDone?'checked':''} onchange="toggleFamilyDone(this.checked)">
      <label for="family-check">${T('قضيت وقتاً مع العائلة اليوم','Spent time with family today')}</label>
    </div>
    <label class="field-label">${T('ملاحظات (مثلاً: جلسة، اتصال، زيارة)','Notes (e.g. sit-down, call, visit)')}</label>
    <textarea oninput="updateFamilyNote(this.value)">${log.familyNote||''}</textarea>
  </div>`;

  document.getElementById('tab10').innerHTML = html;
}
function addMedia(){
  const title = document.getElementById('media-title').value.trim();
  if(!title) return;
  const typeSelect = document.getElementById('media-type').value;
  const type = typeSelect==='other' ? (document.getElementById('media-type-other').value.trim() || T('أخرى','Other')) : typeSelect;
  DB.media.push({id:Date.now(), type, title, date:document.getElementById('media-date').value||todayStr(), note:document.getElementById('media-note').value});
  saveDB(); renderTab10();
}
function toggleFamilyDone(val){ dayLog().familyDone = val; saveDB(); renderTab10(); }
function updateFamilyNote(v){ dayLog().familyNote = v; saveDB(); }

/* ============================================================
   TAB 11: Archive
   ============================================================ */
function renderTab11(){
  let html = `<div class="card"><h3>🔎 ${T('استعراض يوم سابق','Browse a Past Day')}</h3>
    <div class="row">
      <input type="date" id="archive-date-picker" value="${todayStr()}" max="${todayStr()}">
      <button class="btn" style="flex:0 0 auto" onclick="showArchiveDay(document.getElementById('archive-date-picker').value)">${T('عرض التفاصيل','View Details')}</button>
    </div>
    <div id="archiveDetail" style="margin-top:14px"></div>
  </div>`;

  html += `<div class="card"><h3>🗄️ ${T('الأرشيف العام','General Archive')}</h3>`;
  const dates = Object.keys(DB.dailyLogs).sort().reverse();
  if(dates.length===0){
    html += `<p style="color:var(--text-soft);font-size:.85em">${T('لا توجد سجلات سابقة بعد','No past records yet')}</p>`;
  } else {
    dates.forEach(d=>{
      const log = DB.dailyLogs[d];
      const voices = DB.voiceNotes.filter(v=>v.date===d);
      const photos = DB.chatterPhotos.filter(p=>p.date===d);
      html += `<div style="border-bottom:1px solid var(--border);padding:10px 0;cursor:pointer" onclick="showArchiveDay('${d}')">
        <div style="font-weight:700;color:var(--accent-dark)">${d}</div>
        ${log.mood!==null && log.mood!==undefined ? `<div style="font-size:.85em">${T('المزاج','Mood')}: ${MOOD_ITEMS[log.mood].emoji} ${T(MOOD_ITEMS[log.mood].ar,MOOD_ITEMS[log.mood].en)}</div>`:''}
        ${log.chatterText ? `<div style="font-size:.85em;color:var(--text-soft)">"${log.chatterText.slice(0,100)}"</div>`:''}
        ${voices.length? `<div style="margin-top:6px">${voices.map(v=>`<audio controls src="${v.url}" style="width:100%;margin-bottom:4px"></audio>`).join('')}</div>`:''}
        ${photos.length? `<div style="display:flex;gap:6px;margin-top:6px">${photos.map(p=>`<a href="${p.url}" target="_blank"><img class="thumb" src="${p.url}"></a>`).join('')}</div>`:''}
      </div>`;
    });
  }
  html += '</div>';
  document.getElementById('tab11').innerHTML = html;
}
function showArchiveDay(date){
  const el = document.getElementById('archiveDetail');
  if(!el) return;
  if(!date){ el.innerHTML = ''; return; }
  document.getElementById('archive-date-picker').value = date;
  const log = DB.dailyLogs[date];
  if(!log){
    el.innerHTML = `<p style="color:var(--text-soft);font-size:.85em">${T('لا يوجد سجل لهذا اليوم','No record for this day')}</p>`;
    return;
  }
  const dow = new Date(date+'T00:00:00').getDay();
  const weekly = SELFCARE_WEEKLY[dow];
  const scAll = weekly ? [...DB.selfcareItems, weekly] : [...DB.selfcareItems];
  const wtype = DB.fitnessSchedule[dow];
  const workoutSet = wtype==='upper'?EXERCISES_UPPER : wtype==='lower'?EXERCISES_LOWER : null;
  const dayTasks = DB.tasks.filter(t=>t.date===date);
  const dayExpenses = DB.budget.expenses.filter(e=>e.date===date);
  const voices = DB.voiceNotes.filter(v=>v.date===date);
  const photos = DB.chatterPhotos.filter(p=>p.date===date);

  let html = `<div class="card" style="background:var(--card-2)">
    <h4>🕊️ ${T('الروتين والعناية','Routine & Self-care')}</h4>
    ${progressBarHtml(DB.routineItems, log.routine)}
    ${progressBarHtml(scAll, log.selfcare)}`;

  if(log.mood!==null && log.mood!==undefined){
    html += `<h4>💗 ${T('المزاج','Mood')}</h4><div>${MOOD_ITEMS[log.mood].emoji} ${T(MOOD_ITEMS[log.mood].ar,MOOD_ITEMS[log.mood].en)}</div>`;
    if(log.moodNote) html += `<div style="font-size:.85em;color:var(--text-soft)">${log.moodNote}</div>`;
  }
  const gratitude = (log.gratitude||[]).filter(Boolean);
  if(gratitude.length) html += `<h4>🙏 ${T('الامتنان','Gratitude')}</h4>` + gratitude.map(g=>`<div style="font-size:.9em">• ${g}</div>`).join('');

  if(workoutSet){
    html += `<h4>🏋️ ${T('التمرين','Workout')}</h4>${progressBarHtml(workoutSet, log.exercise)}`;
  }
  html += `<h4>📏 ${T('أثناء التمرين','During Workout')}</h4><div style="font-size:.9em">💧 ${T('ماء','Water')}: ${log.water||0} — ⭐ ${T('الشدة','Intensity')}: ${log.intensity||0}/5</div>`;
  if(log.bodyNote) html += `<div style="font-size:.85em;color:var(--text-soft)">${log.bodyNote}</div>`;

  if(log.chatterText) html += `<h4>📝 ${T('كتابة حرة','Free writing')}</h4><div style="font-size:.9em;color:var(--text-soft)">${log.chatterText}</div>`;
  if(voices.length) html += `<h4>🎙️ ${T('تسجيلات صوتية','Voice notes')}</h4>` + voices.map(v=>`<audio controls src="${v.url}" style="width:100%;margin-bottom:4px"></audio>`).join('');
  if(photos.length) html += `<h4>📷 ${T('صور','Photos')}</h4><div style="display:flex;gap:6px;flex-wrap:wrap">` + photos.map(p=>`<a href="${p.url}" target="_blank"><img class="thumb" src="${p.url}"></a>`).join('') + '</div>';

  if(log.familyNote || log.familyDone) html += `<h4>👨‍👩‍👧 ${T('العائلة','Family')}</h4><div style="font-size:.9em">${log.familyDone? T('✓ قضيتِ وقتاً مع العائلة','✓ Spent time with family'):''} ${log.familyNote||''}</div>`;

  if(dayTasks.length){
    html += `<h4>📋 ${T('مهام هذا اليوم','Tasks this day')}</h4>`;
    dayTasks.forEach(t=> html += `<div class="check-item"><span style="flex:1">${t.name}</span><span style="font-size:.8em;color:var(--text-soft)">${t.status}</span></div>`);
  }
  if(dayExpenses.length){
    const cur = currencyLabel();
    html += `<h4>💰 ${T('مصاريف هذا اليوم','Expenses this day')}</h4>`;
    dayExpenses.forEach(e=> html += `<div class="check-item"><span style="flex:1">${e.item} (${e.cat})</span><span>${e.price} ${cur}</span></div>`);
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- init ---------- */
applyLangToDOM();
applyTheme();
switchAuthTab('signup');

auth.onAuthStateChanged(async (user)=>{
  if(user){
    currentUser = user;
    try{
      await loadUserData(user.uid);
      enterApp();
    }catch(e){
      console.error(e);
      alert(T('تعذر تحميل بياناتك، تحققي من الاتصال بالإنترنت','Could not load your data — check your internet connection'));
    }
  } else {
    currentUser = null;
    dataLoaded = false;
    showAuthScreen();
  }
});
setInterval(updateGreeting, 60000);
</script>
